name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    # App Store tests run against SQLite and this Postgres (ADR 0001).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: flowmon
          POSTGRES_PASSWORD: flowmon
          POSTGRES_DB: flowmon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flowmon"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FLOWMON_TEST_POSTGRES_URL: postgres://flowmon:flowmon@localhost:5432/flowmon?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      - name: Fuzz the IPFIX decoder
        run: go test -run '^$' -fuzz FuzzDecode -fuzztime 30s ./internal/ipfix/

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: flowmon:ci
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name flowmon -p 8080:8080 flowmon:ci
          for _ in $(seq 1 30); do
            if docker exec flowmon flowmon healthcheck; then break; fi
            sleep 1
          done
          docker exec flowmon flowmon healthcheck
          curl -fsS http://localhost:8080/ | grep -q '<title>Flowmon</title>'
          test "$(docker exec flowmon id -u)" = 10001
      - name: Logs on failure
        if: failure()
        run: docker logs flowmon || true
