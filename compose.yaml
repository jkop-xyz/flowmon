# Flowmon with Docker Compose: docker compose up -d
#
# Host networking is deliberate: Flowmon identifies each Exporter by its real source
# address, which Docker's port publishing can rewrite, and a published UDP port can
# keep a stale conntrack entry after a restart that silently drops the router's
# packets. See docs/deploy.md.
services:
  flowmon:
    image: ghcr.io/jkop-xyz/flowmon:latest
    container_name: flowmon
    network_mode: host
    # Lets Flowmon force a UDP receive buffer larger than the host's net.core.rmem_max
    # (see docs/deploy.md). Optional.
    # cap_add: [NET_ADMIN]
    restart: unless-stopped
    volumes:
      - flowmon-data:/data
    environment:
      # Everything below is optional; see the README for all settings.
      # FLOWMON_HTTP_ADDR: ":8080"
      # FLOWMON_FLOW_UDP_ADDRS: ":2055,:4739"
      # FLOWMON_DATABASE_URL: "postgres://flowmon@postgres.lan:5432/lab?sslmode=require&search_path=flowmon"
      # FLOWMON_DATABASE_PASSWORD_FILE: /run/secrets/flowmon_db_password
      # FLOWMON_EXPORTER_ALLOWLIST: "192.168.10.1/32"
      # FLOWMON_TRUSTED_PROXIES: "127.0.0.1/32"
      # GeoIP: MaxMind GeoLite2 instead of DB-IP Lite (see docs/deploy.md).
      # FLOWMON_MAXMIND_ACCOUNT_ID: "123456"
      # FLOWMON_MAXMIND_LICENSE_KEY_FILE: /run/secrets/maxmind_license_key
      TZ: UTC
    healthcheck:
      # Declared here as well as in the image, because Podman ignores HEALTHCHECK in
      # OCI images.
      test: ["CMD", "flowmon", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  flowmon-data:
